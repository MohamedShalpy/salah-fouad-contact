<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <title>Salah Fouad | Sales Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 10px 4px;
      display: flex; align-items: center; justify-content: center;
      background: #080808; color: #f7f7f7;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(100%, 560px); min-height: 98vh; padding: 48px 6.3% 34px;
      border: 2px solid #333; border-radius: 38px; background: #141414;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .avatar {
      width: 112px; height: 112px; border: 4px solid #e92743; border-radius: 50%;
      display: grid; place-items: center; font-size: 48px; font-weight: 700;
      margin: 0 auto 40px;
    }
    h1 { margin: 0; font-size: clamp(32px, 7vw, 46px); line-height: 1.15; }
    .role { margin: 26px 0 56px; color: #ed2945; font-size: 18px; font-weight: 700; letter-spacing: 4px; }
    .links { width: 100%; display: flex; flex-direction: column; gap: 17px; }
    .link {
      display: flex; align-items: center; justify-content: center; min-height: 74px;
      width: 100%; padding: 18px 12px; border-radius: 28px; color: white;
      font-size: clamp(20px, 5vw, 28px); font-weight: 700; text-decoration: none;
      transition: filter .15s ease, transform .15s ease;
    }
    .link:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .whatsapp { background: #16864d; }
    .facebook { background: #2169d0; }
    .instagram { background: linear-gradient(110deg, #8a36b0 0%, #e52b62 58%, #ff713c 100%); }
    hr { border: 0; border-top: 2px solid #333; width: 100%; margin: 48px 0 40px; }
    .phone { margin: 0 0 16px; color: #aaa; font-size: clamp(18px, 4.4vw, 24px); line-height: 1.3; }
    .phone a { color: #f4f4f4; text-decoration: none; }
    .footer { margin-top: 46px; color: #777; font-size: 17px; }
    @media (max-width: 380px) {
      .card { padding-top: 36px; border-radius: 28px; }
      .avatar { margin-bottom: 30px; }
      .role { margin-bottom: 42px; letter-spacing: 3px; }
      .link { min-height: 64px; border-radius: 22px; }
      hr { margin: 36px 0 30px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-label="Salah Fouad initials">SF</div>
    <h1>Salah Fouad</h1>
    <p class="role">SALES MANAGER</p>

    <nav class="links" aria-label="Social media links">

      <a class="link facebook" href="https://www.facebook.com/share/1Gi5kuZUZS/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a class="link instagram" href="https://www.instagram.com/sala76738?exln=MW55aTU1bWNjemh4OA%3D%3D&amp;utm_source=qr" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>

    <hr>
    <p class="phone">Mobile 1: <a href="tel:+201125361313">01125361313</a></p>
    <p class="phone">Mobile 2: <a href="tel:+201200965612">01200965612</a></p>
    <p class="footer">CONNECT WITH ME</p>
  </main>
</body>
</html>
